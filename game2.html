<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XOLLYWOOD - Multiplayer Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Space Grotesk', sans-serif;
      color: #ffffff;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000 url('BGxolly.jpg') no-repeat center center;
      background-size: cover;
    }

    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.85) 85%, #000000 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top Left Audio Control Toggles */
    .audio-controls {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .audio-btn {
      background: rgba(0, 20, 35, 0.6);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }

    .audio-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 15px #00f0ff;
    }

    .audio-btn.muted {
      border-color: #ff0055;
      color: #ff0055;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    .hub-container {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
      padding: 20px;
    }

    .main-title {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 8vw, 4.8rem);
      letter-spacing: 8px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #c2d5e2 50%, #5a768d 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.8));
      text-align: center;
    }

    /* Name Input Box */
    .name-input-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .name-label {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: rgba(0, 240, 255, 0.85);
      text-transform: uppercase;
      font-weight: 700;
    }

    .user-name-field {
      width: 100%;
      background: rgba(0, 20, 35, 0.6);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      padding: 10px 16px;
      border-radius: 20px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
      transition: all 0.25s ease;
    }

    .user-name-field:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .hub-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 85%;
      max-width: 360px;
    }

    .btn-action {
      appearance: none;
      background: transparent;
      color: #ffffff;
      border: none;
      outline: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 10px 20px;
      position: relative;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.85);
      transition: all 0.25s ease;
      width: 100%;
      text-align: center;
    }

    .btn-action:hover {
      color: #00f0ff;
      transform: scale(1.05);
      text-shadow: 0 0 18px #00f0ff, 0 0 35px #00f0ff;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    /* Warning Banner */
    .game-warning-banner {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 20, 40, 0.95);
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      letter-spacing: 3px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      z-index: 150;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    .game-warning-banner.show {
      top: 20px;
    }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="sndBgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="sndClickDrop" src="click_drop.mp3" preload="auto"></audio>

  <!-- Top Left Audio Control Toggles -->
  <div class="audio-controls">
    <button class="audio-btn" id="bgmToggleBtn" onclick="toggleBGM()" title="Toggle Background Music">🎵</button>
    <button class="audio-btn" id="sfxToggleBtn" onclick="toggleSFX()" title="Toggle Sound Effects">🔊</button>
  </div>

  <div class="game-warning-banner" id="warningBanner">PLEASE ENTER YOUR NAME FIRST</div>

  <div id="stage">
    <canvas id="spaceCanvas"></canvas>
    <div class="vignette"></div>

    <div class="hub-container">
      <h1 class="main-title">XOLLYWOOD</h1>
      
      <div class="name-input-box">
        <label class="name-label">YOUR PLAYER NAME</label>
        <input type="text" class="user-name-field" id="playerNameInput" placeholder="ENTER NAME" maxlength="12" autocomplete="off" />
      </div>

      <div class="hub-actions">
        <button class="btn-action" onclick="navTo('multiplayer.html')">CREATE ROOM</button>
        <button class="btn-action" onclick="navTo('join.html')">JOIN ROOM</button>
        <button class="btn-action" onclick="navTo('game2_onedevice.html')">ONE DEVICE</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const dustParticles = [];
    for (let i = 0; i < 80; i++) {
      dustParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.6 + 0.4,
        speedX: (Math.random() - 0.5) * 0.25,
        speedY: (Math.random() - 0.5) * 0.4 - 0.1,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    const backgroundComets = [];
    let lastCometSpawn = Date.now();

    function spawnBackgroundComet() {
      const now = Date.now();
      if (now - lastCometSpawn > 2400 && Math.random() < 0.65) {
        lastCometSpawn = now;
        backgroundComets.push({
          x: Math.random() * width * 1.2 + width * 0.05,
          y: -40,
          speedX: -2.8 - Math.random() * 3.5,
          speedY: 4.8 + Math.random() * 4.8,
          length: 45 + Math.random() * 45,
          size: 1.5 + Math.random() * 1.2,
          alpha: 1
        });
      }
    }

    let animTime = 0;
    function render() {
      animTime += 0.02;
      ctx.clearRect(0, 0, width, height);

      dustParticles.forEach((p) => {
        p.x += p.speedX; p.y += p.speedY;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        const twinkle = p.alpha * (0.5 + Math.sin(animTime * 2 + p.x) * 0.5);
        ctx.save();
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      spawnBackgroundComet();
      for (let i = backgroundComets.length - 1; i >= 0; i--) {
        const c = backgroundComets[i];
        c.x += c.speedX; c.y += c.speedY; c.alpha -= 0.012;
        if (c.alpha <= 0 || c.y > height) {
          backgroundComets.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = c.alpha;
        const grad = ctx.createLinearGradient(c.x, c.y, c.x - c.speedX * 7, c.y - c.speedY * 7);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, '#00f0ff');
        grad.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x - c.speedX * 7, c.y - c.speedY * 7);
        ctx.strokeStyle = grad;
        ctx.lineWidth = c.size;
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.restore();
      }
      requestAnimationFrame(render);
    }
    render();

    // --- Audio Control Engine ---
    const sndBgm = document.getElementById('sndBgm');
    const sndClickDrop = document.getElementById('sndClickDrop');

    let bgmMuted = localStorage.getItem('xollywood_bgm_muted') === 'true';
    let sfxMuted = localStorage.getItem('xollywood_sfx_muted') === 'true';

    window.addEventListener('DOMContentLoaded', () => {
      const bgmBtn = document.getElementById('bgmToggleBtn');
      const sfxBtn = document.getElementById('sfxToggleBtn');

      if (bgmMuted) {
        bgmBtn.classList.add('muted');
        bgmBtn.textContent = '🔇';
      }
      if (sfxMuted) {
        sfxBtn.classList.add('muted');
        sfxBtn.textContent = '🔇';
      }

      if (!bgmMuted) {
        sndBgm.volume = 0.25;
        sndBgm.play().catch(() => {});
      }

      const savedName = localStorage.getItem('xollywood_username');
      if (savedName) {
        document.getElementById('playerNameInput').value = savedName;
      }
    });

    function toggleBGM() {
      bgmMuted = !bgmMuted;
      localStorage.setItem('xollywood_bgm_muted', bgmMuted);
      const btn = document.getElementById('bgmToggleBtn');
      if (bgmMuted) {
        sndBgm.pause();
        btn.classList.add('muted');
        btn.textContent = '🔇';
      } else {
        sndBgm.play().catch(() => {});
        btn.classList.remove('muted');
        btn.textContent = '🎵';
      }
    }

    function toggleSFX() {
      sfxMuted = !sfxMuted;
      localStorage.setItem('xollywood_sfx_muted', sfxMuted);
      const btn = document.getElementById('sfxToggleBtn');
      if (sfxMuted) {
        btn.classList.add('muted');
        btn.textContent = '🔇';
      } else {
        btn.classList.remove('muted');
        btn.textContent = '🔊';
      }
    }

    function showWarning(text) {
      const banner = document.getElementById('warningBanner');
      banner.textContent = text;
      banner.classList.add('show');
      if (navigator.vibrate) navigator.vibrate([60, 40]);
      setTimeout(() => {
        banner.classList.remove('show');
      }, 2500);
    }

    function navTo(url) {
      const nameInput = document.getElementById('playerNameInput').value.trim();
      if (!nameInput) {
        showWarning("PLEASE ENTER YOUR NAME FIRST");
        return;
      }

      localStorage.setItem('xollywood_username', nameInput.toUpperCase());

      if (!sfxMuted) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }
      if (navigator.vibrate) navigator.vibrate(30);
      
      setTimeout(() => {
        window.location.href = url;
      }, 200);
    }
  </script>
</body>
</html>
