<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>XOLLYWOOD - Multiplayer Lobby (X v X)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Space Grotesk', sans-serif;
      color: #ffffff;
      touch-action: manipulation;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow-y: auto;
      background: #000000 url('BGxolly.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(60px, 8vh, 80px) 16px 30px 16px;
      padding-top: max(clamp(60px, 8vh, 80px), env(safe-area-inset-top));
      padding-bottom: max(30px, env(safe-area-inset-bottom));
    }

    #spaceCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.85) 85%, #000000 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top Left Audio Control Toggles */
    .audio-controls {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .audio-btn {
      background: rgba(0, 20, 35, 0.6);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }

    .audio-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 15px #00f0ff;
    }

    .audio-btn.muted {
      border-color: #ff0055;
      color: #ff0055;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    /* Header */
    .match-header {
      position: relative;
      z-index: 20;
      text-align: center;
      margin-bottom: clamp(16px, 3vh, 24px);
      width: 100%;
      max-width: 600px;
    }

    .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(1.2rem, 5vw, 2.4rem);
      letter-spacing: clamp(2px, 1vw, 5px);
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      word-break: break-word;
    }

    .sub-title {
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      letter-spacing: 2px;
      color: rgba(0, 240, 255, 0.8);
      margin-top: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Pairings Container */
    .pairings-container {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .pairing-card {
      background: rgba(0, 15, 30, 0.7);
      border: 1.5px solid rgba(0, 240, 255, 0.35);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }

    .player-node {
      font-weight: 800;
      font-size: clamp(0.8rem, 3vw, 0.95rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      flex: 1 1 30%;
      min-width: 90px;
      text-align: center;
      word-break: break-word;
    }

    .player-node.team-a { color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); }
    .player-node.team-b { color: #ffcc00; text-shadow: 0 0 8px rgba(255, 204, 0, 0.6); }

    .vs-tag {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      color: rgba(255, 255, 255, 0.6);
      flex: 0 0 auto;
    }

    .btn-ready {
      appearance: none;
      background: transparent;
      border: 1.5px solid #00ffaa;
      color: #00ffaa;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(0.7rem, 2.5vw, 0.8rem);
      letter-spacing: 2px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
      transition: all 0.25s ease;
      text-transform: uppercase;
      flex: 0 0 auto;
      margin-left: auto;
    }

    .btn-ready.ready-active {
      background: #00ffaa;
      color: #000000;
      box-shadow: 0 0 20px #00ffaa;
    }

    .btn-ready:disabled {
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.4);
      background: transparent;
      box-shadow: none;
      cursor: default;
    }

    /* Host Controls */
    .host-next-row {
      margin-top: 10px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    .btn-next-round {
      appearance: none;
      background: transparent;
      border: 1.5px solid #00f0ff;
      color: #ffffff;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: clamp(0.85rem, 3vw, 1rem);
      letter-spacing: 3px;
      padding: 12px 28px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .btn-next-round:hover {
      background: #00f0ff;
      color: #000000;
      box-shadow: 0 0 35px #00f0ff;
    }

    .btn-see-winner-active {
      background: linear-gradient(135deg, #ffd700, #ff8800) !important;
      border: 2px solid #ffffff !important;
      color: #000000 !important;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8) !important;
      animation: pulseGlow 1.5s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
      100% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 215, 0, 1); }
    }

    .waiting-host-bar {
      z-index: 20;
      background: rgba(0, 20, 35, 0.8);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      backdrop-filter: blur(6px);
      max-width: 480px;
      width: 100%;
    }

    /* GRAND WINNER OVERLAY */
    .game-modal {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 20, 38, 0.94) 0%, rgba(0, 5, 12, 0.98) 75%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(16px);
      padding: 24px 16px;
      text-align: center;
      overflow-y: auto;
    }

    .game-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .winner-reveal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 650px;
      width: 100%;
      animation: revealEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes revealEnter {
      0% {
        opacity: 0;
        transform: scale(0.88) translateY(30px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    .reveal-tag {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(0.85rem, 2.5vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 4px;
      color: #ffd700;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      margin-bottom: 16px;
      animation: fadeInDown 0.6s ease 0.1s both;
    }

    .winner-team-headline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 7vw, 4.4rem);
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 3px;
      line-height: 1.1;
      margin-bottom: 12px;
      animation: textGlowPulse 2.5s infinite alternate ease-in-out;
      word-break: break-word;
    }

    @keyframes textGlowPulse {
      0% {
        text-shadow: 0 0 18px #00f0ff, 0 0 35px rgba(0, 240, 255, 0.5);
      }
      100% {
        text-shadow: 0 0 30px #00f0ff, 0 0 65px rgba(0, 240, 255, 0.9);
      }
    }

    .winner-roster {
      font-size: clamp(0.85rem, 2.8vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      word-break: break-word;
    }

    .reveal-divider {
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00f0ff, transparent);
      box-shadow: 0 0 10px #00f0ff;
      margin: 10px 0 22px 0;
    }

    .winner-mvp-text {
      font-size: clamp(0.8rem, 2.4vw, 1.05rem);
      font-weight: 800;
      letter-spacing: 2px;
      color: #00ffaa;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
      word-break: break-word;
    }

    .winner-score-line {
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .btn-winner-action {
      appearance: none;
      background: transparent;
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      font-weight: 800;
      letter-spacing: 3px;
      padding: 12px 32px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .btn-winner-action:hover {
      background: #00f0ff;
      color: #000000;
      box-shadow: 0 0 35px #00f0ff;
      transform: scale(1.05);
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Warning Banner */
    .game-warning-banner {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 20, 40, 0.95);
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      z-index: 150;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    .game-warning-banner.show { top: max(20px, env(safe-area-inset-top)); }

    /* Mobile Layout Tweaks */
    @media (max-width: 480px) {
      .pairing-card {
        justify-content: center;
      }
      .player-node {
        flex: 1 1 40%;
      }
      .btn-ready {
        width: 100%;
        margin-top: 4px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="sndBgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="sndClickDrop" src="click_drop.mp3" preload="auto"></audio>

  <!-- Top Left Audio Control Toggles -->
  <div class="audio-controls">
    <button class="audio-btn" id="bgmToggleBtn" onclick="toggleBGM()" title="Toggle Background Music">🎵</button>
    <button class="audio-btn" id="sfxToggleBtn" onclick="toggleSFX()" title="Toggle Sound Effects">🔊</button>
  </div>

  <div class="game-warning-banner" id="warningBanner">WAITING...</div>

  <div id="stage">
    <canvas id="spaceCanvas"></canvas>
    <div class="vignette"></div>

    <div class="match-header">
      <h1 class="main-title" id="roundTitleDisplay">ROUND 1 BATTLE LOBBY</h1>
      <div class="sub-title" id="roundSubTitle">PRESS READY TO START YOUR BATTLE</div>
    </div>

    <!-- Pairings List -->
    <div class="pairings-container" id="pairingsContainer"></div>

    <!-- Host Action Row -->
    <div class="host-next-row" id="hostNextRow" style="display:none;">
      <button type="button" class="btn-next-round" id="btnHostRoundAction" onclick="handleHostRoundAction()">NEXT ROUND</button>
    </div>

    <!-- Waiting Banner for Non-Host Players -->
    <div class="waiting-host-bar" id="waitingHostBar" style="display:none;"></div>

    <!-- GRAND WINNER MODAL -->

      <div class="winner-reveal-content">
        <div class="reveal-tag">🏆 TOURNAMENT CHAMPIONS 🏆</div>
        <h1 class="winner-team-headline" id="modalWinnerTeam">TEAM A WINS!</h1>
        <div class="winner-roster" id="modalWinnerPlayers">CHAMPIONS: GAUTHAM</div>

        <div class="reveal-divider"></div>

        <div class="winner-mvp-text" id="modalMvpBadge">★ SUPER PERFORMER: GAUTHAM (2 WINS) ★</div>
        <div class="winner-score-line" id="modalScoreSummary">FINAL SCORE • TEAM A: 2 WINS | TEAM B: 0 WINS</div>

        <button type="button" class="btn-winner-action" onclick="closeWinnerModal()">CONTINUE</button>
      </div>
    </div>
  </div>

  <!-- Movie Pools -->
  <script src="movies.js"></script>
  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const dustParticles = [];
    for (let i = 0; i < 80; i++) {
      dustParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.6 + 0.4,
        speedX: (Math.random() - 0.5) * 0.25,
        speedY: (Math.random() - 0.5) * 0.4 - 0.1,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    let animTime = 0;
    function render() {
      animTime += 0.02;
      ctx.clearRect(0, 0, width, height);

      dustParticles.forEach((p) => {
        p.x += p.speedX; p.y += p.speedY;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        const twinkle = p.alpha * (0.5 + Math.sin(animTime * 2 + p.x) * 0.5);
        ctx.save();
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(render);
    }
    render();

    // --- Audio Engine ---
    const sndBgm = document.getElementById('sndBgm');
    const sndClickDrop = document.getElementById('sndClickDrop');

    let bgmMuted = localStorage.getItem('xollywood_bgm_muted') === 'true';
    let sfxMuted = localStorage.getItem('xollywood_sfx_muted') === 'true';

    window.addEventListener('DOMContentLoaded', () => {
      const bgmBtn = document.getElementById('bgmToggleBtn');
      const sfxBtn = document.getElementById('sfxToggleBtn');

      if (bgmMuted) { bgmBtn.classList.add('muted'); bgmBtn.textContent = '🔇'; }
      if (sfxMuted) { sfxBtn.classList.add('muted'); sfxBtn.textContent = '🔇'; }

      if (!bgmMuted) {
        sndBgm.volume = 0.25;
        sndBgm.play().catch(() => {});
      }

      initLobbyEngine();
    });

    function toggleBGM() {
      bgmMuted = !bgmMuted;
      localStorage.setItem('xollywood_bgm_muted', bgmMuted);
      const btn = document.getElementById('bgmToggleBtn');
      if (bgmMuted) { sndBgm.pause(); btn.classList.add('muted'); btn.textContent = '🔇'; }
      else { sndBgm.play().catch(() => {}); btn.classList.remove('muted'); btn.textContent = '🎵'; }
    }

    function toggleSFX() {
      sfxMuted = !sfxMuted;
      localStorage.setItem('xollywood_sfx_muted', sfxMuted);
      const btn = document.getElementById('sfxToggleBtn');
      if (sfxMuted) { btn.classList.add('muted'); }
      else { btn.classList.remove('muted'); }
    }

    function playClickSound() {
      if (!sfxMuted) {
        if (sndClickDrop && sndClickDrop.readyState >= 2) {
          sndClickDrop.currentTime = 0.26;
          sndClickDrop.play().catch(() => {});
        }
      }
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function playSuccessChime() {
      if (sfxMuted) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const aCtx = new AudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = aCtx.createOscillator();
          const gain = aCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, aCtx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.25, aCtx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + idx * 0.12 + 0.4);
          osc.connect(gain);
          gain.connect(aCtx.destination);
          osc.start(aCtx.currentTime + idx * 0.12);
          osc.stop(aCtx.currentTime + idx * 0.12 + 0.4);
        });
      } catch(e) {}
    }

    function showWarning(text) {
      const banner = document.getElementById('warningBanner');
      banner.textContent = text;
      banner.classList.add('show');
      if (navigator.vibrate) navigator.vibrate([60, 40]);
      setTimeout(() => { banner.classList.remove('show'); }, 2500);
    }

    const firebaseConfig = {
      apiKey: "AIzaSyA0DSuRVDcIbNZvN8ccxUPA4vx2o2HIVQ0",
      authDomain: "xollywood-bbec9.firebaseapp.com",
      databaseURL: "https://xollywood-bbec9-default-rtdb.firebaseio.com",
      projectId: "xollywood-bbec9",
      storageBucket: "xollywood-bbec9.firebasestorage.app",
      messagingSenderId: "164085619380",
      appId: "1:164085619380:web:84b399a72cdcbfb26d5e1",
      measurementId: "G-7DLXQ781CM"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const username = (localStorage.getItem('xollywood_username') || 'PLAYER').trim();
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('code');
    const roomRef = db.ref('xvxml_rooms/' + roomCode);

    let roomData = null;

    function initLobbyEngine() {
      roomRef.on('value', (snapshot) => {
        roomData = snapshot.val();
        if (!roomData) return;

        if (roomData.startYear) {
          localStorage.setItem('xollywood_mp_start_year', roomData.startYear);
        }
        if (roomData.endYear) {
          localStorage.setItem('xollywood_mp_end_year', roomData.endYear);
        }

        const isHost = (roomData.host && roomData.host.trim().toLowerCase() === username.toLowerCase()) ||
                       (Object.keys(roomData.teamA || {})[0] && (roomData.teamA['slot_0'] || '').trim().toLowerCase() === username.toLowerCase());

        let currentRound = roomData.currentRound || 1;
        let totalRounds = roomData.totalRounds || 3;

        document.getElementById('roundTitleDisplay').textContent = `ROUND ${currentRound} BATTLE LOBBY`;

        if (isHost && (!roomData.rounds || !roomData.rounds['round_' + currentRound])) {
          generatePairingsForRound(currentRound);
        }

        if (roomData.rounds && roomData.rounds['round_' + currentRound]) {
          let roundPairings = roomData.rounds['round_' + currentRound].pairings || {};
          renderPairings(roundPairings, isHost, currentRound, totalRounds);

          Object.keys(roundPairings).forEach(pairKey => {
            let p = roundPairings[pairKey];
            if ((p.playerA === username || p.playerB === username) && p.readyA && p.readyB && !p.winner) {
              window.location.href = `multiplayer_game.html?code=${roomCode}&round=${currentRound}&pair=${pairKey}`;
            }
          });
        }
      });

      roomRef.child('finalResult').on('value', (snapshot) => {
        const result = snapshot.val();
        if (result && result.revealed) {
          displayFinalWinnerOnScreen(result);
        }
      });
    }

    function generatePairingsForRound(roundNum) {
      let teamA = Object.values(roomData.teamA || {}).filter(n => n);
      let teamB = Object.values(roomData.teamB || {}).filter(n => n);
      teamB.sort(() => Math.random() - 0.5);

      let industry = roomData.industry || 'MOLLYWOOD';
      let pool = (typeof MOVIE_POOLS !== 'undefined' && MOVIE_POOLS[industry]) ? MOVIE_POOLS[industry] : [
        { title: "LUCIFER", hero: "Mohanlal", year: "2019", type: "Political Action" },
        { title: "DRISHYAM", hero: "Mohanlal", year: "2013", type: "Crime Mystery" },
        { title: "AAVESHAM", hero: "Fahadh Faasil", year: "2024", type: "Action Comedy" }
      ];

      let rawStart = roomData.startYear || localStorage.getItem('xollywood_mp_start_year');
      let rawEnd = roomData.endYear || localStorage.getItem('xollywood_mp_end_year');

      let startYear = rawStart ? parseInt(rawStart) : 1900;
      let endYear = rawEnd ? parseInt(rawEnd) : 2099;

      let filteredPool = pool.filter(m => {
        let y = parseInt(m.year);
        return !isNaN(y) && y >= startYear && y <= endYear;
      });

      // ഫിൽട്ടർ ചെയ്ത ഇയറിൽ മൂവീസ് ഇല്ലെങ്കിൽ ബാക്കപ്പ് ആയി മെയിൻ പൂളിൽ നിന്ന് സിനിമ എടുക്കും
      if (filteredPool.length === 0) {
        filteredPool = pool;
      }

      let pairingsObj = {};
      let maxCount = Math.max(teamA.length, teamB.length);
      for (let i = 0; i < maxCount; i++) {
        let randMovie = filteredPool[Math.floor(Math.random() * filteredPool.length)];
        
        // Industry പേരും സിനിമയ്ക്കൊപ്പം ചേർക്കുന്നു
        let selectedMovieObj = {
          title: randMovie.title,
          hero: randMovie.hero || '',
          year: randMovie.year || '',
          type: randMovie.type || randMovie.genre || '',
          industry: industry
        };

        pairingsObj['pair_' + i] = {
          playerA: teamA[i] || 'TEAM A PLAYER',
          playerB: teamB[i] || 'TEAM B PLAYER',
          readyA: false,
          readyB: false,
          movie: selectedMovieObj,
          winner: ''
        };
      }

      roomRef.child('rounds/round_' + roundNum).set({ pairings: pairingsObj });
    }

    function renderPairings(pairings, isHost, currentRound, totalRounds) {
      const container = document.getElementById('pairingsContainer');
      container.innerHTML = '';

      let allPairsFinished = true;

      Object.keys(pairings).forEach((key) => {
        let p = pairings[key];
        let isUserInPair = (p.playerA === username || p.playerB === username);
        let userReady = (p.playerA === username && p.readyA) || (p.playerB === username && p.readyB);

        let statusText = "READY";
        let btnClass = "";
        if (p.winner) {
          statusText = `WIN: ${p.winner}`;
        } else if (userReady) {
          statusText = "READY ✓";
          btnClass = "ready-active";
        }

        if (!p.winner) allPairsFinished = false;

        container.innerHTML += `
          <div class="pairing-card">
            <span class="player-node team-a">${p.playerA}</span>
            <span class="vs-tag">VS</span>
            <span class="player-node team-b">${p.playerB}</span>
            ${isUserInPair && !p.winner ? `<button type="button" class="btn-ready ${btnClass}" onclick="toggleReady('${key}', ${currentRound})">${statusText}</button>` : `<button type="button" class="btn-ready" disabled>${statusText}</button>`}
          </div>
        `;
      });

      const hostNextRow = document.getElementById('hostNextRow');
      const btnHostAction = document.getElementById('btnHostRoundAction');
      const waitingBar = document.getElementById('waitingHostBar');

      if (allPairsFinished && Object.keys(pairings).length > 0) {
        if (isHost) {
          waitingBar.style.display = 'none';
          hostNextRow.style.display = 'flex';

          if (currentRound < totalRounds) {
            btnHostAction.textContent = `START ROUND ${currentRound + 1}`;
            btnHostAction.classList.remove('btn-see-winner-active');
          } else {
            btnHostAction.innerHTML = `🏆 SEE THE WINNER`;
            btnHostAction.classList.add('btn-see-winner-active');
          }
        } else {
          hostNextRow.style.display = 'none';
          waitingBar.style.display = 'block';
          if (currentRound < totalRounds) {
            waitingBar.innerHTML = `⏳ ROUND ${currentRound} COMPLETED! WAITING FOR HOST TO START ROUND ${currentRound + 1}...`;
          } else {
            waitingBar.innerHTML = `🏆 ALL ROUNDS COMPLETED! WAITING FOR HOST TO REVEAL THE WINNER...`;
          }
        }
      } else {
        hostNextRow.style.display = 'none';
        waitingBar.style.display = 'none';
      }
    }

    function toggleReady(pairKey, currentRound) {
      playClickSound();
      roomRef.child(`rounds/round_${currentRound}/pairings/` + pairKey).once('value', (snap) => {
        let p = snap.val();
        if (!p || p.winner) return;

        let updates = {};
        if (p.playerA === username) updates['readyA'] = !p.readyA;
        else if (p.playerB === username) updates['readyB'] = !p.readyB;

        roomRef.child(`rounds/round_${currentRound}/pairings/` + pairKey).update(updates);
      });
    }

    function handleHostRoundAction() {
      playClickSound();
      let currentRound = roomData.currentRound || 1;
      let totalRounds = roomData.totalRounds || 3;

      if (currentRound < totalRounds) {
        roomRef.update({ currentRound: currentRound + 1 });
      } else {
        broadcastFinalWinnerToAllPlayers();
      }
    }

    function broadcastFinalWinnerToAllPlayers() {
      roomRef.once('value', (snap) => {
        let rData = snap.val() || {};
        let rounds = rData.rounds || {};
        let winsTeamA = 0;
        let winsTeamB = 0;
        let playerWins = {};

        let teamAMembers = Object.values(rData.teamA || {}).filter(n => n);
        let teamBMembers = Object.values(rData.teamB || {}).filter(n => n);

        teamAMembers.forEach(name => { playerWins[name] = 0; });
        teamBMembers.forEach(name => { playerWins[name] = 0; });

        Object.keys(rounds).forEach(rKey => {
          let pairings = rounds[rKey].pairings || {};
          Object.keys(pairings).forEach(pKey => {
            let p = pairings[pKey];
            if (p.winner && p.winner !== "DRAW") {
              if (teamAMembers.includes(p.winner)) {
                winsTeamA++;
                playerWins[p.winner] = (playerWins[p.winner] || 0) + 1;
              } else if (teamBMembers.includes(p.winner)) {
                winsTeamB++;
                playerWins[p.winner] = (playerWins[p.winner] || 0) + 1;
              }
            }
          });
        });

        let winningTeamName = "DRAW";
        let winningPlayers = [];

        if (winsTeamA > winsTeamB) {
          winningTeamName = "TEAM A";
          winningPlayers = teamAMembers;
        } else if (winsTeamB > winsTeamA) {
          winningTeamName = "TEAM B";
          winningPlayers = teamBMembers;
        } else {
          winningTeamName = "IT'S A DRAW!";
          winningPlayers = [...teamAMembers, ...teamBMembers];
        }

        let maxWins = 0;
        Object.keys(playerWins).forEach(pName => {
          if (playerWins[pName] > maxWins) maxWins = playerWins[pName];
        });

        let topPlayers = [];
        if (maxWins > 0) {
          Object.keys(playerWins).forEach(pName => {
            if (playerWins[pName] === maxWins) {
              topPlayers.push(`${pName} (${maxWins} wins)`);
            }
          });
        }

        roomRef.child('finalResult').set({
          revealed: true,
          winningTeam: winningTeamName,
          winningPlayers: winningPlayers,
          teamAWins: winsTeamA,
          teamBWins: winsTeamB,
          topPlayersText: topPlayers.length > 0 ? topPlayers.join(', ') : 'All Players',
          timestamp: Date.now()
        });
      });
    }

    function displayFinalWinnerOnScreen(res) {
      const modal = document.getElementById('gameModal');
      const teamTitle = document.getElementById('modalWinnerTeam');
      const playersList = document.getElementById('modalWinnerPlayers');
      const mvpBadge = document.getElementById('modalMvpBadge');
      const scoreSummary = document.getElementById('modalScoreSummary');

      if (res.winningTeam.includes("DRAW")) {
        teamTitle.textContent = "IT'S A DRAW!";
      } else {
        teamTitle.textContent = `${res.winningTeam} WINS!`;
      }

      if (res.winningPlayers && res.winningPlayers.length > 0) {
        playersList.textContent = `CHAMPIONS: ${res.winningPlayers.join(' • ')}`;
      } else {
        playersList.textContent = '';
      }

      if (res.topPlayersText) {
        mvpBadge.textContent = `★ SUPER PERFORMER: ${res.topPlayersText} ★`;
        mvpBadge.style.display = 'block';
      } else {
        mvpBadge.style.display = 'none';
      }

      scoreSummary.textContent = `FINAL SCORE • TEAM A: ${res.teamAWins} WINS  |  TEAM B: ${res.teamBWins} WINS`;

      playSuccessChime();
      modal.classList.add('active');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 250]);
    }

    function closeWinnerModal() {
      document.getElementById('gameModal').classList.remove('active');
    }
  </script>
