<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XOLLYWOOD - Join Room</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Space Grotesk', sans-serif;
      color: #ffffff;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000 url('BGxolly.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.85) 85%, #000000 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top Left Audio Control Toggles */
    .audio-controls {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .audio-btn {
      background: rgba(0, 20, 35, 0.6);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }

    .audio-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 15px #00f0ff;
    }

    .audio-btn.muted {
      border-color: #ff0055;
      color: #ff0055;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    .join-card {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 380px;
      background: rgba(0, 15, 30, 0.65);
      border: 1.5px solid rgba(0, 240, 255, 0.35);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .form-label {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: rgba(0, 240, 255, 0.9);
      text-transform: uppercase;
      font-weight: 700;
    }

    .input-code {
      width: 100%;
      background: rgba(0, 20, 35, 0.8);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      padding: 14px;
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      text-align: center;
      outline: none;
      letter-spacing: 8px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
    }

    .input-code:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .btn-join-room {
      appearance: none;
      background: transparent;
      border: 1.5px solid #00f0ff;
      color: #ffffff;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 14px;
      border-radius: 30px;
      margin-top: 5px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-join-room:hover {
      background: #00f0ff;
      color: #000000;
      box-shadow: 0 0 30px #00f0ff;
      transform: translateY(-2px);
    }

    .btn-join-room:active {
      transform: scale(0.97);
    }

    .join-status {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #ffcc00;
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
    }

    /* Warning Banner */
    .game-warning-banner {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 20, 40, 0.95);
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      letter-spacing: 3px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      z-index: 150;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    .game-warning-banner.show {
      top: 20px;
    }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="sndBgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="sndClickDrop" src="click_drop.mp3" preload="auto"></audio>

  <!-- Top Left Audio Control Toggles -->
  <div class="audio-controls">
    <button class="audio-btn" id="bgmToggleBtn" onclick="toggleBGM()" title="Toggle Background Music">🎵</button>
    <button class="audio-btn" id="sfxToggleBtn" onclick="toggleSFX()" title="Toggle Sound Effects">🔊</button>
  </div>

  <div class="game-warning-banner" id="warningBanner">PLEASE ENTER ROOM ID</div>

  <div id="stage">
    <canvas id="spaceCanvas"></canvas>
    <div class="vignette"></div>

    <div class="join-card">
      <h1 class="main-title">JOIN ROOM</h1>

      <div class="form-group">
        <label class="form-label">Enter 4-Digit Room Code</label>
        <input type="text" class="input-code" id="roomCodeInput" maxlength="4" placeholder="0000" autocomplete="off" />
      </div>

      <button type="button" class="btn-join-room" onclick="joinMultiplayerRoom()">JOIN BATTLE</button>
      <div class="join-status" id="joinStatusText"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const dustParticles = [];
    for (let i = 0; i < 80; i++) {
      dustParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.6 + 0.4,
        speedX: (Math.random() - 0.5) * 0.25,
        speedY: (Math.random() - 0.5) * 0.4 - 0.1,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    let animTime = 0;
    function render() {
      animTime += 0.02;
      ctx.clearRect(0, 0, width, height);

      dustParticles.forEach((p) => {
        p.x += p.speedX; p.y += p.speedY;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        const twinkle = p.alpha * (0.5 + Math.sin(animTime * 2 + p.x) * 0.5);
        ctx.save();
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(render);
    }
    render();

    // --- Audio Control Engine ---
    const sndBgm = document.getElementById('sndBgm');
    const sndClickDrop = document.getElementById('sndClickDrop');

    let bgmMuted = localStorage.getItem('xollywood_bgm_muted') === 'true';
    let sfxMuted = localStorage.getItem('xollywood_sfx_muted') === 'true';

    window.addEventListener('DOMContentLoaded', () => {
      const bgmBtn = document.getElementById('bgmToggleBtn');
      const sfxBtn = document.getElementById('sfxToggleBtn');

      if (bgmMuted) {
        bgmBtn.classList.add('muted');
        bgmBtn.textContent = '🔇';
      }
      if (sfxMuted) {
        sfxBtn.classList.add('muted');
        sfxBtn.textContent = '🔇';
      }

      if (!bgmMuted) {
        sndBgm.volume = 0.25;
        sndBgm.play().catch(() => {});
      }
    });

    function toggleBGM() {
      bgmMuted = !bgmMuted;
      localStorage.setItem('xollywood_bgm_muted', bgmMuted);
      const btn = document.getElementById('bgmToggleBtn');
      if (bgmMuted) {
        sndBgm.pause();
        btn.classList.add('muted');
        btn.textContent = '🔇';
      } else {
        sndBgm.play().catch(() => {});
        btn.classList.remove('muted');
        btn.textContent = '🎵';
      }
    }

    function toggleSFX() {
      sfxMuted = !sfxMuted;
      localStorage.setItem('xollywood_sfx_muted', sfxMuted);
      const btn = document.getElementById('sfxToggleBtn');
      if (sfxMuted) {
        btn.classList.add('muted');
        btn.textContent = '🔇';
      } else {
        btn.classList.remove('muted');
        btn.textContent = '🔊';
      }
    }

    function playClickSound() {
      if (!sfxMuted) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function showWarning(text) {
      const banner = document.getElementById('warningBanner');
      banner.textContent = text;
      banner.classList.add('show');
      if (navigator.vibrate) navigator.vibrate([60, 40]);
      setTimeout(() => { banner.classList.remove('show'); }, 2500);
    }

    // --- Firebase & Join Logic ---
    const firebaseConfig = {
      apiKey: "AIzaSyA0DSuRVDcIbNZvN8ccxUPA4vx2o2HIVQ0",
      authDomain: "xollywood-bbec9.firebaseapp.com",
      databaseURL: "https://xollywood-bbec9-default-rtdb.firebaseio.com",
      projectId: "xollywood-bbec9",
      storageBucket: "xollywood-bbec9.firebasestorage.app",
      messagingSenderId: "164085619380",
      appId: "1:164085619380:web:84b399a72cdcbfb26d5e1",
      measurementId: "G-7DLXQ781CM"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function joinMultiplayerRoom() {
      playClickSound();
      const code = document.getElementById('roomCodeInput').value.trim();
      const statusText = document.getElementById('joinStatusText');

      if (code.length !== 4) {
        showWarning("ENTER A VALID 4-DIGIT ROOM CODE");
        return;
      }

      statusText.textContent = "CHECKING ROOM...";

      const roomRef = db.ref('xvxml_rooms/' + code);
      roomRef.once('value', (snap) => {
        if (!snap.exists()) {
          statusText.textContent = "";
          showWarning("ROOM NOT FOUND!");
          return;
        }

        statusText.textContent = "CONNECTING...";
        setTimeout(() => {
          window.location.href = `multiplayer2.html?code=${code}`;
        }, 300);
      });
    }
  </script>
</body>
</html>
