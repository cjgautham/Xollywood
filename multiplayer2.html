<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>XOLLYWOOD - Multiplayer Lobby (X v X)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Space Grotesk', sans-serif;
      color: #ffffff;
      touch-action: manipulation;
    }

    /* Mobile Viewport Fix */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #000000 url('BGxolly.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(10px, 2vh, 16px) clamp(8px, 2vw, 12px);
      padding-top: max(clamp(10px, 2vh, 16px), env(safe-area-inset-top));
      padding-bottom: max(clamp(10px, 2vh, 16px), env(safe-area-inset-bottom));
    }

    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.85) 85%, #000000 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top Left Audio Control Toggles */
    .audio-controls {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      z-index: 100;
      display: flex;
      gap: 6px;
    }

    .audio-btn {
      background: rgba(0, 20, 35, 0.7);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
      transition: all 0.25s ease;
      font-size: 0.8rem;
    }

    .audio-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 12px #00f0ff;
    }

    .audio-btn.muted {
      border-color: #ff0055;
      color: #ff0055;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.3);
    }

    /* Lobby Header Shifted Downward */
    .lobby-header {
      position: relative;
      z-index: 20;
      text-align: center;
      margin-top: clamp(28px, 6vh, 48px); /* Shifted below audio buttons */
      margin-bottom: clamp(6px, 1.5vh, 12px);
      width: 100%;
    }

    .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 4.2vw, 1.8rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    }

    .room-code-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      background: rgba(0, 20, 35, 0.75);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      padding: 4px 12px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
    }

    .room-label {
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      color: rgba(0, 240, 255, 0.8);
      font-weight: 700;
    }

    .room-code-val {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
    }

    .btn-copy {
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 2px 6px;
      font-size: 0.6rem;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: #00f0ff;
      color: #000000;
    }

    /* Teams Arena Layout */
    .teams-arena {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: auto 0;
      overflow-y: auto;
      max-height: 48vh;
    }

    .team-column {
      flex: 1;
      background: rgba(0, 15, 30, 0.65);
      border: 1.5px solid rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .team-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(0.78rem, 2.5vw, 0.9rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      color: #00f0ff;
      margin-bottom: 2px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .slot-card {
      background: rgba(0, 30, 50, 0.5);
      border: 1px dashed rgba(0, 240, 255, 0.3);
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.72rem, 2.2vw, 0.82rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .slot-card.filled {
      border: 1px solid #00f0ff;
      background: rgba(0, 240, 255, 0.12);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    }

    .slot-name {
      color: #ffffff;
      text-transform: uppercase;
      word-break: break-word;
      max-width: 70%;
    }

    .btn-switch-slot {
      background: transparent;
      border: 1px solid #ffcc00;
      color: #ffcc00;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-switch-slot:hover {
      background: #ffcc00;
      color: #000000;
    }

    /* Lobby Control Panel */
    .lobby-controls {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .lobby-status {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      color: #ffcc00;
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 0 6px rgba(255, 204, 0, 0.5);
    }

    .btn-start-battle {
      appearance: none;
      background: transparent;
      border: 1.5px solid #00f0ff;
      color: #ffffff;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 10px;
      border-radius: 25px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      transition: all 0.3s ease;
      text-align: center;
      width: 100%;
    }

    .btn-start-battle:disabled {
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-start-battle:hover:not(:disabled) {
      background: #00f0ff;
      color: #000000;
      box-shadow: 0 0 25px #00f0ff;
    }

    /* Warning Banner */
    .game-warning-banner {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 20, 40, 0.95);
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.6);
      z-index: 150;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      text-align: center;
      width: 90%;
      max-width: 380px;
    }

    .game-warning-banner.show {
      top: max(10px, env(safe-area-inset-top));
    }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="sndBgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="sndClickDrop" src="click_drop.mp3" preload="auto"></audio>

  <!-- Top Left Audio Control Toggles -->
  <div class="audio-controls">
    <button class="audio-btn" id="bgmToggleBtn" onclick="toggleBGM()" title="Toggle Background Music">🎵</button>
    <button class="audio-btn" id="sfxToggleBtn" onclick="toggleSFX()" title="Toggle Sound Effects">🔊</button>
  </div>

  <div class="game-warning-banner" id="warningBanner">WAITING FOR PLAYERS...</div>

  <div id="stage">
    <canvas id="spaceCanvas"></canvas>
    <div class="vignette"></div>

    <div class="lobby-header">
      <h1 class="main-title" id="lobbyTitle">X v X BATTLE LOBBY</h1>
      <div class="room-code-box">
        <span class="room-label">ROOM ID:</span>
        <span class="room-code-val" id="roomCodeDisplay">----</span>
        <button type="button" class="btn-copy" onclick="copyRoomCode()">COPY</button>
      </div>
    </div>

    <!-- Teams Arena Slots -->
    <div class="teams-arena">
      <div class="team-column">
        <div class="team-title">TEAM A</div>
        <div id="teamASlots"></div>
      </div>
      <div class="team-column">
        <div class="team-title">TEAM B</div>
        <div id="teamBSlots"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="lobby-controls">
      <div class="lobby-status" id="lobbyStatusText">WAITING FOR ALL SLOTS TO FILL...</div>
      <button type="button" class="btn-start-battle" id="btnStartBattle" disabled onclick="hostStartMatch()">START BATTLE</button>
    </div>
  </div>

  <script>
    // Canvas Background
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const dustParticles = [];
    for (let i = 0; i < 80; i++) {
      dustParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.6 + 0.4,
        speedX: (Math.random() - 0.5) * 0.25,
        speedY: (Math.random() - 0.5) * 0.4 - 0.1,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    let animTime = 0;
    function render() {
      animTime += 0.02;
      ctx.clearRect(0, 0, width, height);

      dustParticles.forEach((p) => {
        p.x += p.speedX; p.y += p.speedY;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        const twinkle = p.alpha * (0.5 + Math.sin(animTime * 2 + p.x) * 0.5);
        ctx.save();
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(render);
    }
    render();

    // Audio Engine
    const sndBgm = document.getElementById('sndBgm');
    const sndClickDrop = document.getElementById('sndClickDrop');

    let bgmMuted = localStorage.getItem('xollywood_bgm_muted') === 'true';
    let sfxMuted = localStorage.getItem('xollywood_sfx_muted') === 'true';

    window.addEventListener('DOMContentLoaded', () => {
      const bgmBtn = document.getElementById('bgmToggleBtn');
      const sfxBtn = document.getElementById('sfxToggleBtn');

      if (bgmMuted) {
        bgmBtn.classList.add('muted');
        bgmBtn.textContent = '🔇';
      }
      if (sfxMuted) {
        sfxBtn.classList.add('muted');
        sfxBtn.textContent = '🔇';
      }

      if (!bgmMuted) {
        sndBgm.volume = 0.25;
        sndBgm.play().catch(() => {});
      }
    });

    function toggleBGM() {
      bgmMuted = !bgmMuted;
      localStorage.setItem('xollywood_bgm_muted', bgmMuted);
      const btn = document.getElementById('bgmToggleBtn');
      if (bgmMuted) {
        sndBgm.pause();
        btn.classList.add('muted');
        btn.textContent = '🔇';
      } else {
        sndBgm.play().catch(() => {});
        btn.classList.remove('muted');
        btn.textContent = '🎵';
      }
    }

    function toggleSFX() {
      sfxMuted = !sfxMuted;
      localStorage.setItem('xollywood_sfx_muted', sfxMuted);
      const btn = document.getElementById('sfxToggleBtn');
      if (sfxMuted) {
        btn.classList.add('muted');
        btn.textContent = '🔇';
      } else {
        btn.classList.remove('muted');
        btn.textContent = '🔊';
      }
    }

    function playClickSound() {
      if (!sfxMuted) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function showWarning(text) {
      const banner = document.getElementById('warningBanner');
      banner.textContent = text;
      banner.classList.add('show');
      if (navigator.vibrate) navigator.vibrate([60, 40]);
      setTimeout(() => { banner.classList.remove('show'); }, 2500);
    }

    // Firebase & Lobby Logic
    const firebaseConfig = {
      apiKey: "AIzaSyA0DSuRVDcIbNZvN8ccxUPA4vx2o2HIVQ0",
      authDomain: "xollywood-bbec9.firebaseapp.com",
      databaseURL: "https://xollywood-bbec9-default-rtdb.firebaseio.com",
      projectId: "xollywood-bbec9",
      storageBucket: "xollywood-bbec9.firebasestorage.app",
      messagingSenderId: "164085619380",
      appId: "1:164085619380:web:84b399a72cdcbfb26d5e1",
      measurementId: "G-7DLXQ781CM"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let username = (localStorage.getItem('xollywood_username') || 'PLAYER').trim();
    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('code');
    const isHost = !roomCode;

    if (isHost) {
      roomCode = Math.floor(1000 + Math.random() * 9000).toString();
    }

    document.getElementById('roomCodeDisplay').textContent = roomCode;
    const roomRef = db.ref('xvxml_rooms/' + roomCode);

    let totalPlayers = 4;
    let slotsPerTeam = 2;

    if (isHost) {
      const industry = localStorage.getItem('xollywood_mp_industry') || 'MOLLYWOOD';
      const players = parseInt(localStorage.getItem('xollywood_mp_players') || '4');
      const rounds = parseInt(localStorage.getItem('xollywood_mp_rounds') || '3');
      
      totalPlayers = players;
      slotsPerTeam = totalPlayers / 2;

      let initialSlotsA = { slot_0: username };
      let initialSlotsB = {};
      for(let i=1; i<slotsPerTeam; i++) {
        initialSlotsA['slot_' + i] = '';
      }
      for(let i=0; i<slotsPerTeam; i++) {
        initialSlotsB['slot_' + i] = '';
      }

      roomRef.set({
        industry: industry,
        totalPlayers: totalPlayers,
        totalRounds: rounds,
        state: 'waiting',
        teamA: initialSlotsA,
        teamB: initialSlotsB
      }, () => {
        attachRoomListener();
      });
    } else {
      roomRef.once('value', (snap) => {
        let data = snap.val();
        if(!data) {
          showWarning("ROOM NOT FOUND!");
          return;
        }
        totalPlayers = data.totalPlayers || 4;
        slotsPerTeam = totalPlayers / 2;

        assignPlayerToEmptySlot(data);
        attachRoomListener();
      });
    }

    function attachRoomListener() {
      roomRef.on('value', (snapshot) => {
        let data = snapshot.val();
        if(!data) return;

        totalPlayers = data.totalPlayers || 4;
        slotsPerTeam = totalPlayers / 2;

        renderSlots(data.teamA, data.teamB);
        checkRoomReady(data);

        if(data.state === 'playing') {
          window.location.href = `multiplayer3.html?code=${roomCode}`;
        }
      });
    }

    // Function to ensure unique usernames (e.g. GAUTHAM -> GAUTHAM 2 -> GAUTHAM 3)
    function generateUniqueUsername(baseName, existingNames) {
      let uniqueName = baseName;
      let counter = 2;
      while (existingNames.map(n => n.toLowerCase()).includes(uniqueName.toLowerCase())) {
        uniqueName = `${baseName} ${counter}`;
        counter++;
      }
      return uniqueName;
    }

    function assignPlayerToEmptySlot(data) {
      let teamA = data.teamA || {};
      let teamB = data.teamB || {};

      let existingPlayers = [];
      Object.values(teamA).forEach(val => { if (val) existingPlayers.push(val); });
      Object.values(teamB).forEach(val => { if (val) existingPlayers.push(val); });

      // Check if user is already in a slot
      let alreadyInA = Object.values(teamA).some(val => val.toLowerCase() === username.toLowerCase());
      let alreadyInB = Object.values(teamB).some(val => val.toLowerCase() === username.toLowerCase());

      if (alreadyInA || alreadyInB) return;

      // Handle duplicate username auto-rename
      let finalUsername = generateUniqueUsername(username, existingPlayers);
      if (finalUsername !== username) {
        username = finalUsername;
        localStorage.setItem('xollywood_username', username);
        showWarning(`JOINED AS ${username}`);
      }

      let assigned = false;
      let updates = {};

      for(let i=0; i<slotsPerTeam; i++) {
        let key = 'slot_' + i;
        if(!teamA[key] || teamA[key] === '') {
          updates['teamA/' + key] = username;
          assigned = true;
          break;
        }
      }

      if(!assigned) {
        for(let i=0; i<slotsPerTeam; i++) {
          let key = 'slot_' + i;
          if(!teamB[key] || teamB[key] === '') {
            updates['teamB/' + key] = username;
            assigned = true;
            break;
          }
        }
      }

      if(assigned) {
        roomRef.update(updates);
      } else {
        showWarning("ROOM IS FULL!");
      }
    }

    function switchSlot(targetTeam, targetIndex) {
      playClickSound();
      roomRef.once('value', (snap) => {
        let data = snap.val();
        if (!data) return;

        let teamA = data.teamA || {};
        let teamB = data.teamB || {};
        let targetKey = 'slot_' + targetIndex;

        if (targetTeam === 'teamA' && (!teamA[targetKey] || teamA[targetKey] === '')) {
          for(let i=0; i<slotsPerTeam; i++) {
            if(teamA['slot_' + i] === username) teamA['slot_' + i] = '';
            if(teamB['slot_' + i] === username) teamB['slot_' + i] = '';
          }
          teamA[targetKey] = username;
          roomRef.update({ teamA: teamA, teamB: teamB });
        } else if (targetTeam === 'teamB' && (!teamB[targetKey] || teamB[targetKey] === '')) {
          for(let i=0; i<slotsPerTeam; i++) {
            if(teamA['slot_' + i] === username) teamA['slot_' + i] = '';
            if(teamB['slot_' + i] === username) teamB['slot_' + i] = '';
          }
          teamB[targetKey] = username;
          roomRef.update({ teamA: teamA, teamB: teamB });
        }
      });
    }

    function renderSlots(teamA, teamB) {
      let boxA = document.getElementById('teamASlots');
      let boxB = document.getElementById('teamBSlots');
      boxA.innerHTML = '';
      boxB.innerHTML = '';

      for(let i=0; i<slotsPerTeam; i++) {
        let nameA = teamA && teamA['slot_' + i] ? teamA['slot_' + i] : '';
        let isEmptyA = !nameA;
        boxA.innerHTML += `
          <div class="slot-card ${nameA ? 'filled' : ''}">
            <span class="slot-name">${nameA || 'EMPTY SLOT'}</span>
            ${nameA === username ? '<span style="font-size:0.65rem; color:#00f0ff;">(YOU)</span>' : ''}
            ${isEmptyA ? `<button class="btn-switch-slot" onclick="switchSlot('teamA', ${i})">JOIN</button>` : ''}
          </div>
        `;

        let nameB = teamB && teamB['slot_' + i] ? teamB['slot_' + i] : '';
        let isEmptyB = !nameB;
        boxB.innerHTML += `
          <div class="slot-card ${nameB ? 'filled' : ''}">
            <span class="slot-name">${nameB || 'EMPTY SLOT'}</span>
            ${nameB === username ? '<span style="font-size:0.65rem; color:#00f0ff;">(YOU)</span>' : ''}
            ${isEmptyB ? `<button class="btn-switch-slot" onclick="switchSlot('teamB', ${i})">JOIN</button>` : ''}
          </div>
        `;
      }
    }

    function checkRoomReady(data) {
      let filledCount = 0;
      for(let i=0; i<slotsPerTeam; i++) {
        if(data.teamA && data.teamA['slot_' + i]) filledCount++;
        if(data.teamB && data.teamB['slot_' + i]) filledCount++;
      }

      const statusText = document.getElementById('lobbyStatusText');
      const startBtn = document.getElementById('btnStartBattle');

      if(filledCount === totalPlayers) {
        statusText.textContent = "ALL PLAYERS CONNECTED!";
        statusText.style.color = "#00ffaa";
        if(isHost) {
          startBtn.disabled = false;
        } else {
          startBtn.disabled = true;
          startBtn.textContent = "WAITING FOR HOST TO START...";
        }
      } else {
        statusText.textContent = `WAITING FOR PLAYERS (${filledCount}/${totalPlayers})...`;
        statusText.style.color = "#ffcc00";
        startBtn.disabled = true;
      }
    }

    function copyRoomCode() {
      playClickSound();
      navigator.clipboard.writeText(roomCode).then(() => {
        showWarning("ROOM CODE COPIED!");
      });
    }

    function hostStartMatch() {
      playClickSound();
      roomRef.update({ state: 'playing' });
    }
  </script>
</body>
</html>
