<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XOLLYWOOD</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Space Grotesk', sans-serif;
      touch-action: none;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #000000 url('BGxolly.jpg') no-repeat center center;
      background-size: cover;
    }

    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.85) 85%, #000000 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* ============ YEAR SELECT SCREEN ============ */
    .year-select-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 60;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      text-align: center;
    }

    .year-select-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .year-heading {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 800;
      letter-spacing: 5px;
      color: #00f0ff;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.7);
      margin-bottom: 30px;
    }

    .year-range-picker {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(14px, 3.5vw, 26px);
      margin: 0 auto 34px auto;
      width: 100%;
    }

    .year-select-box {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: clamp(100px, 22vw, 130px);
    }

    .year-dropdown {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 800;
      text-align: center;
      outline: none;
      cursor: pointer;
      width: 100%;
      padding: 8px 6px 10px 6px;
      text-shadow: 0 0 12px #00f0ff;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      text-align-last: center;
    }

    .year-dropdown option {
      background-color: #05101a;
      color: #00f0ff;
      font-weight: 700;
    }

    .year-arrow {
      margin-top: 6px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #ffffff;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
      pointer-events: none;
    }

    .year-dash-line {
      width: 100%;
      height: 3px;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
      border-radius: 2px;
      margin-top: 8px;
    }

    .year-separator {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      align-self: center;
      margin-top: 10px;
    }

    .btn-ready {
      display: block;
      margin: 0 auto;
      background: transparent;
      border: 1.5px solid #00f0ff;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 6px;
      padding: 12px 38px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .btn-ready:hover {
      background: #00f0ff;
      color: #000000;
      box-shadow: 0 0 32px #00f0ff;
      transform: scale(1.05);
    }

    .game-ui-hidden {
      display: none !important;
    }

    /* ============ GAME LAYOUT ============ */
    .game-layout {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      gap: 6px;
    }

    .hud-top {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .hud-left-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.05);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      transition: all 0.4s ease;
      white-space: nowrap;
    }

    .streak-icon { font-size: 1rem; display: inline-block; }

    .streak-lvl-1 {
      border-color: #00f0ff; color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5), inset 0 0 8px rgba(0, 240, 255, 0.2);
    }
    .streak-lvl-2 {
      border-color: #00b4d8; background: rgba(0, 180, 216, 0.12); color: #caf0f8;
      box-shadow: 0 0 22px rgba(0, 180, 216, 0.8), 0 0 35px rgba(0, 119, 182, 0.5), inset 0 0 12px rgba(0, 240, 255, 0.4);
      animation: flamePulse 1.6s infinite alternate ease-in-out;
    }
    .streak-lvl-3 {
      border-color: #90e0ef; background: rgba(0, 240, 255, 0.2); color: #ffffff;
      box-shadow: 0 0 25px #00f0ff, 0 0 50px #0077b6, inset 0 0 16px #00f0ff;
      animation: ragingFlame 0.9s infinite alternate ease-in-out;
    }

    @keyframes flamePulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 8px #00f0ff); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 18px #0077b6); }
    }
    @keyframes ragingFlame {
      0% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 12px #00f0ff); }
      100% { transform: scale(1.08) rotate(1deg); filter: drop-shadow(0 0 28px #00f0ff); }
    }

    .btn-skip {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #ffffff;
      padding: 8px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .btn-skip:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      transform: scale(1.05);
    }

    .audio-controls { display: flex; gap: 8px; margin-top: 2px; }

    .audio-btn {
      background: rgba(0, 20, 35, 0.6);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      transition: all 0.25s ease;
      font-size: 0.78rem;
    }
    .audio-btn:hover { background: rgba(0, 240, 255, 0.25); box-shadow: 0 0 15px #00f0ff; }
    .audio-btn.muted { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }

    .industry-life-title {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(3px, 1vw, 8px);
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      max-width: 60vw;
    }

    .life-letter {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: clamp(1.1rem, 4vw, 2rem);
      color: #ffffff;
      display: inline-block;
      text-shadow: 0 0 12px #00f0ff, 0 0 24px rgba(0, 240, 255, 0.6);
      transition: transform 0.65s cubic-bezier(0.55, 0.055, 0.675, 0.19), opacity 0.5s ease;
    }

    .letter-dropped {
      transform: translateY(140px) rotate(28deg) scale(0.4) !important;
      opacity: 0 !important;
      color: #ff0055 !important;
      text-shadow: 0 0 20px #ff0055 !important;
    }

    .clue-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      max-width: 42vw;
    }

    .clue-header {
      font-size: 0.68rem;
      letter-spacing: 3px;
      color: rgba(0, 240, 255, 0.85);
      text-transform: uppercase;
      font-weight: 800;
    }

    .clue-btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    .btn-clue {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #ffffff;
      padding: 6px 11px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 2px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
    }
    .btn-clue:hover:not(:disabled) {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00f0ff;
      box-shadow: 0 0 14px #00f0ff;
    }
    .btn-clue:disabled { cursor: default; }

    .btn-clue.clue-used {
      border-color: #ff0055;
      color: #ff0055;
      background: rgba(255, 0, 85, 0.15);
      box-shadow: 0 0 14px #ff0055, inset 0 0 8px rgba(255, 0, 85, 0.5);
      animation: clueLockFlash 0.5s ease-out;
    }

    @keyframes clueLockFlash {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); box-shadow: 0 0 25px #ff0055; }
      100% { transform: scale(1); }
    }

    .clue-display-box {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .clue-item {
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      color: #ffb3c6;
      text-shadow: 0 0 8px #ff0055;
      text-transform: uppercase;
      text-align: right;
      background: rgba(255, 0, 85, 0.12);
      border: 1px solid rgba(255, 0, 85, 0.4);
      border-radius: 10px;
      padding: 4px 10px;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.55), inset 0 0 8px rgba(255, 0, 85, 0.25);
      animation: fadeInClue 0.3s ease-out forwards;
    }

    @keyframes fadeInClue {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---- Word Board ---- */
    .game-board {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 750px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      align-items: center;
      gap: clamp(6px, 1.8vw, 16px);
      overflow-y: auto;
      padding: 6px 0;
    }

    .char-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: clamp(24px, 6.2vw, 46px);
    }

    .char-val {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(1.3rem, 5vw, 2.4rem);
      color: #ffffff;
      text-shadow: 0 0 16px #00f0ff;
      min-height: 38px;
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .char-revealed { opacity: 1 !important; transform: scale(1) !important; }

    /* Red revealed letters on Game Over */
    .char-missed {
      opacity: 1 !important;
      transform: scale(1) !important;
      color: #ff0055 !important;
      text-shadow: 0 0 16px #ff0055, 0 0 30px #ff0055 !important;
      animation: popRedChar 0.4s ease-out forwards;
    }

    @keyframes popRedChar {
      0% { transform: scale(0.2); opacity: 0; }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); opacity: 1; }
    }

    .char-dash {
      width: 100%;
      height: 3px;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
      border-radius: 2px;
      margin-top: 4px;
    }

    .char-dash-red {
      background: #ff0055 !important;
      box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055 !important;
    }

    /* ---- Keyboard ---- */
    .keyboard-container {
      flex: 0 0 auto;
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .kb-row { display: flex; justify-content: center; gap: 5px; }

    .key-btn {
      appearance: none;
      background: rgba(0, 240, 255, 0.04);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.85rem, 3vw, 1.15rem);
      font-weight: 700;
      width: clamp(24px, 7.6vw, 44px);
      height: clamp(34px, 8.4vw, 46px);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .key-btn:hover:not(:disabled) {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 16px #00f0ff;
      transform: translateY(-2px);
    }

    .key-btn:disabled { pointer-events: none; }

    .key-correct {
      background: rgba(0, 255, 170, 0.2) !important;
      border-color: #00ffaa !important;
      color: #00ffaa !important;
      box-shadow: 0 0 15px #00ffaa !important;
      opacity: 0.5;
    }

    .key-dropped {
      animation: completeKeyDrop 0.65s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards !important;
      pointer-events: none !important;
    }

    @keyframes completeKeyDrop {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      30% { transform: translateY(20px) rotate(5deg); color: #ff0055; border-color: #ff0055; box-shadow: 0 0 15px #ff0055; }
      100% { transform: translateY(220px) rotate(25deg); opacity: 0; visibility: hidden; }
    }

    @media (max-height: 480px) {
      .game-layout { gap: 3px; padding-top: 6px; padding-bottom: 6px; }
      .char-slot { width: clamp(20px, 5.5vw, 34px); }
      .char-val { min-height: 26px; }
      .key-btn { height: clamp(28px, 7vw, 36px); }
      .life-letter { font-size: clamp(0.9rem, 3.4vw, 1.4rem); }
    }

    /* ---- Result Modal ---- */
    .game-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, background 0.5s ease;
      backdrop-filter: blur(8px);
      padding: 20px;
      text-align: center;
    }

    .game-modal.active { opacity: 1; pointer-events: auto; }

    .game-modal.modal-win {
      background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.25), rgba(0, 0, 0, 0.92) 75%);
    }
    .game-modal.modal-lose {
      background: radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.3), rgba(0, 0, 0, 0.92) 75%);
    }

    .modal-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2rem, 9vw, 3.8rem);
      font-weight: 900;
      margin-bottom: 12px;
      text-align: center;
      padding: 10px 24px;
    }

    .win-title {
      color: #00ff88;
      text-shadow: 0 0 25px #00ff88, 0 0 50px #00ff88;
    }

    .lose-title {
      color: #ff0055;
      text-shadow: 0 0 25px #ff0055, 0 0 50px #ff0055;
    }

    .modal-movie-reveal {
      font-size: 1rem;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 30px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .btn-next-round {
      background: transparent;
      border: 1.5px solid #00f0ff;
      color: #ffffff;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 6px;
      padding: 12px 32px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      transition: all 0.25s ease;
    }
    .btn-next-round:hover { background: #00f0ff; color: #000000; box-shadow: 0 0 35px #00f0ff; transform: scale(1.05); }

    .btn-try-again {
      border-color: #ff0055 !important;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4) !important;
    }
    .btn-try-again:hover {
      background: #ff0055 !important;
      color: #ffffff !important;
      box-shadow: 0 0 35px #ff0055 !important;
    }
  </style>
</head>
<body>

  <audio id="sndBgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="sndClickDrop" src="click_drop.mp3" preload="auto"></audio>

  <div id="stage">
    <canvas id="spaceCanvas"></canvas>
    <div class="vignette"></div>

    <!-- 1. Year Selection Screen -->
    <div class="year-select-screen" id="yearSelectScreen">
      <h2 class="year-heading">SELECT ERA</h2>
      <div class="year-range-picker">
        <div class="year-select-box">
          <select id="startYearSelect" class="year-dropdown"></select>
          <span class="year-arrow"></span>
          <div class="year-dash-line"></div>
        </div>
        <span class="year-separator">TO</span>
        <div class="year-select-box">
          <select id="endYearSelect" class="year-dropdown"></select>
          <span class="year-arrow"></span>
          <div class="year-dash-line"></div>
        </div>
      </div>
      <button class="btn-ready" onclick="confirmYearRange()">READY</button>
    </div>

    <!-- 2. Game UI -->
    <div class="game-layout game-ui-hidden" id="gameLayout">
      <div class="hud-top" id="hudTop">
        <div class="hud-left">
          <div class="hud-left-row">
            <div class="streak-badge" id="streakBadge">
              <span class="streak-icon">🔥</span>
              <span id="streakText">STREAK 0</span>
            </div>
            <button class="btn-skip" onclick="skipMovie()">SKIP</button>
          </div>
          <div class="audio-controls">
            <button class="audio-btn" id="bgmToggleBtn" onclick="toggleBGM()" title="Toggle Background Music">🎵</button>
            <button class="audio-btn" id="sfxToggleBtn" onclick="toggleSFX()" title="Toggle Sound Effects">🔊</button>
          </div>
        </div>

        <div class="industry-life-title" id="lifeTitleContainer"></div>

        <div class="clue-panel">
          <span class="clue-header">CLUES</span>
          <div class="clue-btn-row">
            <button class="btn-clue" id="btnClueHero" onclick="useClue('hero')">HERO</button>
            <button class="btn-clue" id="btnClueYear" onclick="useClue('year')">YEAR</button>
            <button class="btn-clue" id="btnClueType" onclick="useClue('type')">TYPE</button>
          </div>
          <div class="clue-display-box" id="clueDisplayBox"></div>
        </div>
      </div>

      <div class="game-board" id="gameBoard"></div>
      <div class="keyboard-container" id="keyboardContainer"></div>
    </div>

    <div class="game-modal" id="gameModal">
      <h1 class="modal-title" id="modalTitle"></h1>
      <p class="modal-movie-reveal" id="modalMovieReveal"></p>
      <button class="btn-next-round" id="btnModalAction" onclick="startNewRound()">NEXT MOVIE</button>
    </div>
  </div>

  <script>
    // --- 1. Canvas Background ---
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const dustParticles = [];
    for (let i = 0; i < 80; i++) {
      dustParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.6 + 0.4,
        speedX: (Math.random() - 0.5) * 0.25,
        speedY: (Math.random() - 0.5) * 0.4 - 0.1,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    const backgroundComets = [];
    let lastCometSpawn = Date.now();

    function spawnBackgroundComet() {
      const now = Date.now();
      if (now - lastCometSpawn > 2400 && Math.random() < 0.65) {
        lastCometSpawn = now;
        backgroundComets.push({
          x: Math.random() * width * 1.2 + width * 0.05,
          y: -40,
          speedX: -2.8 - Math.random() * 3.5,
          speedY: 4.8 + Math.random() * 4.8,
          length: 45 + Math.random() * 45,
          size: 1.5 + Math.random() * 1.2,
          alpha: 1
        });
      }
    }

    let animTime = 0;
    function render() {
      animTime += 0.02;
      ctx.clearRect(0, 0, width, height);

      dustParticles.forEach((p) => {
        p.x += p.speedX; p.y += p.speedY;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        const twinkle = p.alpha * (0.5 + Math.sin(animTime * 2 + p.x) * 0.5);
        ctx.save();
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      spawnBackgroundComet();
      for (let i = backgroundComets.length - 1; i >= 0; i--) {
        const c = backgroundComets[i];
        c.x += c.speedX; c.y += c.speedY; c.alpha -= 0.012;
        if (c.alpha <= 0 || c.y > height) {
          backgroundComets.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = c.alpha;
        const grad = ctx.createLinearGradient(c.x, c.y, c.x - c.speedX * 7, c.y - c.speedY * 7);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, '#00f0ff');
        grad.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x - c.speedX * 7, c.y - c.speedY * 7);
        ctx.strokeStyle = grad;
        ctx.lineWidth = c.size;
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.restore();
      }
      requestAnimationFrame(render);
    }

    // --- 3. Streak Engine & Game Logic ---
    const urlParams = new URLSearchParams(window.location.search);
    const selectedIndustry = urlParams.get('industry') || localStorage.getItem('xollywood_industry') || 'MOLLYWOOD';

    let lifeLetters = selectedIndustry.split('');
    let currentLifeIndex = 0;

    let activeClues = { hero: false, year: false, type: false };

    let playedMovieTitles = new Set();
    let movieHasNumbers = false;
    let selectedStartYear = 1980;
    let selectedEndYear = 2026;

    const streakBadge = document.getElementById('streakBadge');
    const streakText = document.getElementById('streakText');
    const lifeTitleContainer = document.getElementById('lifeTitleContainer');
    const gameBoard = document.getElementById('gameBoard');
    const keyboardContainer = document.getElementById('keyboardContainer');
    const clueDisplayBox = document.getElementById('clueDisplayBox');

    const modalMovieReveal = document.getElementById('modalMovieReveal');
    const btnModalAction = document.getElementById('btnModalAction');
    const gameLayout = document.getElementById('gameLayout');

    function initYearSelector() {
      const industryTiers = MOVIE_DATABASE_TIERS[selectedIndustry] || MOVIE_DATABASE_TIERS.MOLLYWOOD;
      const allMovies = [
        ...(industryTiers.EASY || []),
        ...(industryTiers.MEDIUM || []),
        ...(industryTiers.HARD || [])
      ];

      let minYear = 1980;
      allMovies.forEach(m => {
        const y = parseInt(m.year);
        if (!isNaN(y) && y < minYear) minYear = y;
      });

      const startSelect = document.getElementById('startYearSelect');
      const endSelect = document.getElementById('endYearSelect');
      startSelect.innerHTML = '';
      endSelect.innerHTML = '';

      const startMilestones = [1980, 1990, 2000, 2005, 2010, 2015, 2020, 2022, 2024];
      const startOptions = [];
      if (minYear < 1980) startOptions.push(minYear);
      startMilestones.forEach(y => { if (!startOptions.includes(y)) startOptions.push(y); });

      startOptions.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        if (y === 1980) opt.selected = true;
        startSelect.appendChild(opt);
      });

      const endYears = [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015];
      endYears.forEach((y, idx) => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        if (idx === 0) opt.selected = true;
        endSelect.appendChild(opt);
      });

      selectedStartYear = parseInt(startSelect.value) || 1980;
      selectedEndYear = parseInt(endSelect.value) || 2026;

      startSelect.onchange = () => { selectedStartYear = parseInt(startSelect.value); };
      endSelect.onchange = () => { selectedEndYear = parseInt(endSelect.value); };
    }

    function confirmYearRange() {
      if (selectedStartYear > selectedEndYear) {
        alert("Start Year must be less than or equal to End Year!");
        return;
      }

      if (!sfxMuted && sndClickDrop) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }

      document.getElementById('yearSelectScreen').classList.add('hidden');
      gameLayout.classList.remove('game-ui-hidden');

      loadMovie();
    }

    function updateStreakVisuals() {
      streakText.textContent = `STREAK ${streak}`;
      streakBadge.className = 'streak-badge';

      if (streak >= 1 && streak <= 3) streakBadge.classList.add('streak-lvl-1');
      else if (streak >= 4 && streak <= 7) streakBadge.classList.add('streak-lvl-2');
      else if (streak >= 8) streakBadge.classList.add('streak-lvl-3');
    }

    function getMovieForCurrentStreak() {
      const industryTiers = MOVIE_DATABASE_TIERS[selectedIndustry] || MOVIE_DATABASE_TIERS.MOLLYWOOD;
      let targetPool = industryTiers.EASY || [];

      if (streak < 4) targetPool = industryTiers.EASY || [];
      else if (streak >= 4 && streak < 8) targetPool = industryTiers.MEDIUM || [];
      else targetPool = industryTiers.HARD || [];

      let filteredPool = targetPool.filter(m => {
        const y = parseInt(m.year);
        return !isNaN(y) && y >= selectedStartYear && y <= selectedEndYear;
      });

      if (filteredPool.length === 0) {
        const allTierMovies = [
          ...(industryTiers.EASY || []),
          ...(industryTiers.MEDIUM || []),
          ...(industryTiers.HARD || [])
        ];
        filteredPool = allTierMovies.filter(m => {
          const y = parseInt(m.year);
          return !isNaN(y) && y >= selectedStartYear && y <= selectedEndYear;
        });
      }

      if (filteredPool.length === 0) {
        filteredPool = targetPool.length > 0 ? targetPool : (industryTiers.EASY || []);
      }

      let available = filteredPool.filter(m => !playedMovieTitles.has(m.title));

      if (available.length === 0) {
        playedMovieTitles.clear();
        available = filteredPool;
      }

      const pickedMovie = available[Math.floor(Math.random() * available.length)];
      if (pickedMovie) playedMovieTitles.add(pickedMovie.title);
      return pickedMovie;
    }

    function renderLifeHUD() {
      lifeTitleContainer.innerHTML = '';
      lifeLetters.forEach((char, idx) => {
        const span = document.createElement('span');
        span.className = 'life-letter';
        span.id = `life-char-${idx}`;
        span.textContent = char;
        lifeTitleContainer.appendChild(span);
      });
    }

    function dropLifeLetter() {
      if (currentLifeIndex < lifeLetters.length) {
        const targetSpan = document.getElementById(`life-char-${currentLifeIndex}`);
        if (targetSpan) targetSpan.classList.add('letter-dropped');
        currentLifeIndex++;

        if (currentLifeIndex >= lifeLetters.length) {
          triggerGameOver(false);
        }
      }
    }

    const KEYBOARD_ROWS_BASE = [
      ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
      ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
      ["Z", "X", "C", "V", "B", "N", "M"]
    ];

    const NUMBER_ROW = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"];

    function buildKeyboard(hasNumbers) {
      keyboardContainer.innerHTML = '';
      const rows = hasNumbers ? [NUMBER_ROW, ...KEYBOARD_ROWS_BASE] : KEYBOARD_ROWS_BASE;

      rows.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'kb-row';
        row.forEach(key => {
          const btn = document.createElement('button');
          btn.className = 'key-btn';
          btn.id = `key-${key}`;
          btn.textContent = key;
          btn.onclick = () => handleKeyGuess(key);
          rowDiv.appendChild(btn);
        });
        keyboardContainer.appendChild(rowDiv);
      });
    }

    function loadMovie() {
      currentMovie = getMovieForCurrentStreak();
      if (!currentMovie) return;

      guessedLetters.clear();
      isGameOver = false;
      currentLifeIndex = 0;

      movieHasNumbers = /\d/.test(currentMovie.title);

      activeClues = { hero: false, year: false, type: false };
      clueDisplayBox.innerHTML = '';

      updateStreakVisuals();
      renderLifeHUD();
      buildKeyboard(movieHasNumbers);

      ['btnClueHero', 'btnClueYear', 'btnClueType'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('clue-used');
        }
      });

      gameBoard.innerHTML = '';
      for (let i = 0; i < currentMovie.title.length; i++) {
        const char = currentMovie.title[i].toUpperCase();
        const slot = document.createElement('div');
        slot.className = 'char-slot';

        if (char === ' ') {
          slot.style.width = '20px';
          slot.innerHTML = '<span class="char-val">&nbsp;</span>';
        } else {
          slot.innerHTML = `
            <span class="char-val" id="slot-${i}">${char}</span>
            <div class="char-dash" id="dash-${i}"></div>
          `;
        }
        gameBoard.appendChild(slot);
      }
    }

    function handleKeyGuess(charInput) {
      if (isGameOver || guessedLetters.has(charInput) || !currentMovie) return;

      if (/\d/.test(charInput) && !movieHasNumbers) return;

      guessedLetters.add(charInput);

      if (!sfxMuted) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }

      const keyBtn = document.getElementById(`key-${charInput}`);
      const upperTitle = currentMovie.title.toUpperCase();

      if (upperTitle.includes(charInput)) {
        if (navigator.vibrate) navigator.vibrate(30);
        if (keyBtn) {
          keyBtn.disabled = true;
          keyBtn.classList.add('key-correct');
        }
        for (let i = 0; i < upperTitle.length; i++) {
          if (upperTitle[i] === charInput) {
            const charEl = document.getElementById(`slot-${i}`);
            if (charEl) charEl.classList.add('char-revealed');
          }
        }
        checkWinCondition();
      } else {
        if (navigator.vibrate) navigator.vibrate([60, 40]);
        if (keyBtn) {
          keyBtn.classList.add('key-dropped');
          keyBtn.disabled = true;
        }
        dropLifeLetter();
      }
    }

    window.addEventListener('keydown', (e) => {
      const yearScreen = document.getElementById('yearSelectScreen');
      if (yearScreen && !yearScreen.classList.contains('hidden')) return;

      const key = e.key.toUpperCase();
      if (/^[A-Z]$/.test(key)) {         handleKeyGuess(key);       } else if (/^[0-9]$/.test(key) && movieHasNumbers) {
        handleKeyGuess(key);
      }
    });

    function useClue(type) {
      if (isGameOver || activeClues[type] || !currentMovie) return;
      if (navigator.vibrate) navigator.vibrate(40);

      activeClues[type] = true;

      if (!sfxMuted) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }

      const clueItem = document.createElement('div');
      clueItem.className = 'clue-item';

      let btnId = '';
      if (type === 'hero') { clueItem.textContent = `Hero: ${currentMovie.hero}`; btnId = 'btnClueHero'; }
      else if (type === 'year') { clueItem.textContent = `Year: ${currentMovie.year}`; btnId = 'btnClueYear'; }
      else if (type === 'type') { clueItem.textContent = `Genre: ${currentMovie.type}`; btnId = 'btnClueType'; }

      const btn = document.getElementById(btnId);
      if (btn) {
        btn.disabled = true;
        btn.classList.add('clue-used');
      }

      clueDisplayBox.appendChild(clueItem);
      dropLifeLetter();
    }

    function skipMovie() {
      if (navigator.vibrate) navigator.vibrate(40);
      if (!sfxMuted) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }
      streak = 0;
      updateStreakVisuals();
      loadMovie();
    }

    function checkWinCondition() {
      const upperTitle = currentMovie.title.toUpperCase().replace(/\s/g, '');
      let hasWon = true;
      for (let char of upperTitle) {
        if (!guessedLetters.has(char)) { hasWon = false; break; }
      }
      if (hasWon) triggerGameOver(true);
    }

    function triggerGameOver(isWin) {
      isGameOver = true;

      if (isWin) {
        streak++;
        updateStreakVisuals();
        gameModal.classList.remove('modal-lose');
        gameModal.classList.add('modal-win');
        modalTitle.className = 'modal-title win-title';
        modalTitle.textContent = 'YOU WON!';
        modalMovieReveal.textContent = `Movie: ${currentMovie.title} (Streak: ${streak})`;
        btnModalAction.className = 'btn-next-round';
        btnModalAction.textContent = 'NEXT MOVIE';
        if (navigator.vibrate) navigator.vibrate([50, 100, 50, 100]);
        
        setTimeout(() => {
          gameModal.classList.add('active');
        }, 400);

      } else {
        // --- 1. Reveal missing letters in glowing RED right on the board ---
        const upperTitle = currentMovie.title.toUpperCase();
        for (let i = 0; i < upperTitle.length; i++) {
          const ch = upperTitle[i];
          const charEl = document.getElementById(`slot-${i}`);
          const dashEl = document.getElementById(`dash-${i}`);
          if (!charEl) continue;
          if (ch !== ' ' && !guessedLetters.has(ch)) {
            charEl.classList.add('char-missed');
            if (dashEl) dashEl.classList.add('char-dash-red');
          }
        }

        streak = 0;
        updateStreakVisuals();

        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        // --- 2. Wait 2 seconds before popping up the GAME OVER screen ---
        setTimeout(() => {
          gameModal.classList.remove('modal-win');
          gameModal.classList.add('modal-lose');
          modalTitle.className = 'modal-title lose-title';
          modalTitle.textContent = 'GAME OVER';
          modalMovieReveal.textContent = `Movie: ${currentMovie.title}`;
          btnModalAction.className = 'btn-next-round btn-try-again';
          btnModalAction.textContent = 'TRY AGAIN';
          gameModal.classList.add('active');
        }, 2000);
      }
    }

    function startNewRound() {
      if (!sfxMuted) {
        sndClickDrop.currentTime = 0.26;
        sndClickDrop.play().catch(() => {});
      }
      gameModal.classList.remove('active', 'modal-win', 'modal-lose');
      loadMovie();
    }

    initYearSelector();
  </script>
</body>
</html>
